name: Update profile art

on:
  schedule:
    - cron: "15 18 * * *" # 03:15 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Render contribution graph
        run: python scripts/render_contributions.py

      - name: Render language stats
        env:
          # Private repositories are invisible to the default GITHUB_TOKEN, so this
          # needs a personal access token that can read every repository we own.
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/make_language_stats_svg.py

      - name: Publish refreshed art to assets branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin assets-bot
          git worktree add --detach "${{ runner.temp }}/assets-bot" FETCH_HEAD
          cp assets/contrib-heatmap.svg assets/lang-stats.svg "${{ runner.temp }}/assets-bot/"
          cd "${{ runner.temp }}/assets-bot"
          if git diff --quiet; then
            echo "Profile art is unchanged."
            exit 0
          fi
          git add contrib-heatmap.svg lang-stats.svg
          git commit -m "chore: refresh profile art [skip ci]"
          git push origin HEAD:assets-bot
