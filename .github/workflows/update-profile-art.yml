name: Update profile art

on:
  schedule:
    - cron: "15 18 * * *" # 03:15 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render contribution graph
        run: python scripts/render_contributions.py

      - name: Commit refreshed graph
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "assets/contrib-heatmap.svg"
