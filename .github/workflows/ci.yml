name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate configuration and Python
        run: |
          python -m json.tool profile-art.json > /dev/null
          python -m compileall -q scripts

      - name: Validate README assets
        run: |
          test -f README.md
          test -f assets/ascii-portrait.svg
          test -f assets/hiro-ascii.svg
          test -f assets/wordmark.svg
          test -f assets/contrib-heatmap.svg

      - name: Validate SVG XML
        run: >-
          python -c "import xml.etree.ElementTree as ET;
          [ET.parse(path) for path in
          ('assets/ascii-portrait.svg', 'assets/hiro-ascii.svg',
          'assets/wordmark.svg', 'assets/contrib-heatmap.svg')]"

      - name: Verify generated portrait is current
        run: |
          python scripts/make_ascii_svg.py
          git diff --exit-code -- assets/hiro-ascii.svg
